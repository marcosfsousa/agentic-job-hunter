name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]
  # Automatic review. Deliberately NOT `synchronize` — that re-reviews on every
  # push. Push follow-up commits freely, then comment @claude to re-review when
  # the branch is actually ready.
  #
  # `paths-ignore` skips prose-only PRs. One run spent a full agentic review on a
  # five-line comment correction in CLAUDE.md; a human reads that faster than the
  # review takes to start. A PR touching ANY path outside this list is reviewed as
  # normal, so a spec PR that also amends an ADR still gets reviewed.
  #
  # `.github/**` is deliberately NOT ignored: workflow diffs carry permissions and
  # secret handling, which is the last thing that should merge unreviewed.
  pull_request:
    types: [opened, ready_for_review]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

jobs:
  # ---------------------------------------------------------------------------
  # Automatic PR review. This is the ONLY automated review any PR here gets:
  # `.coderabbit.yaml` disables CodeRabbit's auto-review outright (it was already
  # skipping every pivot spec PR — its auto-review only runs against the default
  # branch — and two bots on one diff produced findings nobody reconciled).
  #
  # That is why the `paths-ignore` above is narrow. Widening it does not hand the
  # review to another bot; it removes the review. `@coderabbitai review` still
  # works on demand if a second opinion is ever wanted.
  # ---------------------------------------------------------------------------
  review:
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      actions: read  # read the Tests workflow's result rather than trusting the PR body
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history — the review diffs against the merge-base

      - name: Review
        uses: anthropics/claude-code-action@v1
        with:
          # Authenticates against the Claude subscription, not the API credit
          # balance — the review is the subscription's cost, not a per-run charge.
          # Generate with `claude setup-token` locally; it is a personal account
          # credential, so rotate it like one.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Required with OAuth. This defaults to `true`, which buffers inline
          # comments and runs a separate classification pass over them — and that
          # pass authenticates with `anthropic_api_key`, which this job no longer
          # supplies. `false` restores the pre-buffering behaviour: inline comments
          # post immediately. Only safe to drop if this job stops asking for inline
          # comments, which its prompt below does.
          classify_inline_comments: "false"

          use_sticky_comment: true  # one comment per PR, updated — not a new one each run
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE BRANCH: ${{ github.event.pull_request.base.ref }}

            Review this pull request along two axes, reported under separate headings.
            The PR branch is already checked out. Diff against the merge-base:
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`

            ## Standards
            Does the diff follow this repo's documented conventions? Read `CLAUDE.md`
            (Code conventions, Constraints, Architecture, Git workflow) and `CONTEXT.md`
            (the domain glossary — code that contradicts a glossary term is a bug, and
            the glossary says so itself). Cite the file and rule for each finding.

            ## Spec
            Find the originating issue from the PR body or commit messages (`#NN`) and
            read it with `gh issue view NN`. Report: requirements missing or partial;
            behaviour in the diff nobody asked for; requirements implemented wrongly.
            Quote the spec line for each finding. If the spec names an ADR under
            `docs/adr/`, read it — where a spec and its ADR disagree, the ADR wins.

            ## Rules
            - Do NOT take test or typecheck claims in the PR body on trust. Check the
              `Tests` workflow with `gh pr checks` / `gh run view`. If it has not
              finished or did not run, say so plainly rather than assuming it passed.
            - Distinguish blocking issues from judgement calls, and say which is which.
            - A finding the spec explicitly deferred to another ticket is not a defect.
              Check the spec's "Out of Scope" section before reporting one.
            - Say plainly if you find nothing blocking. Do not invent findings to fill
              the report.

            Post the review with `gh pr comment`. Use inline comments for specific
            lines. Do not return review text as a chat message — only GitHub comments.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run view:*),Bash(gh run list:*),Bash(gh issue view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*)"

  # ---------------------------------------------------------------------------
  # On-demand: responds to an @claude mention on an issue, PR or review comment.
  # ---------------------------------------------------------------------------
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Same subscription auth as the review job above. Switched together on
          # purpose: leaving this one on the API key would mean @claude — the
          # escape hatch for a PR the review skipped — is the one path that still
          # fails when the credit balance is empty.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # Set for the same reason as the review job: this job can post inline
          # comments too, and the classification pass wants an API key that is no
          # longer here. Documented to be skipped rather than fatal when the key is
          # absent, but that is stated for federation, not OAuth — so it is set
          # explicitly rather than left to undocumented behaviour.
          classify_inline_comments: "false"

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
