name: Daily Job Scout

on:
  # Re-armed with the freelancermap adapter, which is what disarming it was waiting
  # for: while the registry was empty a scheduled run fetched nothing and exited 0
  # with a clean "No evaluated matches for today" — a silent failure indistinguishable
  # from a genuinely quiet day.
  #
  # Cadence targets ~08:00–09:00 CEST delivery. The off-minute avoids the thundering
  # herd on the hour; 03:00 UTC was chosen over 04:00 because the observed Actions
  # queue delay there was materially lower (~5h at 04:00).
  schedule:
    - cron: '15 3 * * *'
  workflow_dispatch:       # allow manual trigger from GitHub UI

concurrency:
  group: daily-job-scout
  cancel-in-progress: false  # let the running job finish; don't drop in-flight pipeline work

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # required to push data commit-back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # suppress Node.js 20 deprecation warning

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache HuggingFace model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: huggingface-multilingual-e5-small

      # The database is no longer carried by git, so dedup state has to survive
      # between runs some other way. Rolling key: restore the newest previous
      # cache, save this run's under a unique key. A cold cache is a degraded
      # digest that re-shows seen listings, not a broken pipeline — never fatal.
      - name: Cache job database
        uses: actions/cache@v4
        with:
          path: data/jobscout.db
          key: jobscout-db-${{ github.run_id }}
          restore-keys: |
            jobscout-db-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        if: github.event_name != 'schedule'
        run: pytest

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: python -m jobscout.run --verbose

      # Feedback only. data/jobscout.db is never staged — it carries the full
      # description of every ingested listing and must not be republished.
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feedback.yaml
          git diff --cached --quiet || git commit -m "chore: update job data [skip ci]"
          git pull --rebase && git push

      - name: Notify on failure
        if: failure()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
        run: |
          python -c "
          import os, resend
          api_key = os.environ.get('RESEND_API_KEY', '')
          to = os.environ.get('EMAIL_TO', '')
          frm = os.environ.get('EMAIL_FROM', '')
          if not all([api_key, to, frm]):
              print('Email not configured - skipping failure notification')
              exit(0)
          resend.api_key = api_key
          resend.Emails.send({
              'from': frm,
              'to': [to],
              'subject': 'JobScout pipeline failed',
              'text': 'The daily JobScout pipeline failed.\nCheck: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}',
          })
          print('Failure notification sent')
          "
