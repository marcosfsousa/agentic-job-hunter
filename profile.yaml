name: "Marcos"

# background / ideal_role are written POSITIVE-ONLY. Both feed the embedding query
# (embedder.py), and the model encodes topics not inversions — a clause like "not
# classical ML" would pull the query TOWARD classical ML. Every negative clause lives
# in `deprioritise` below instead, where prompt.py injects it into Haiku and the
# embedder never sees it. (F #9 decision 3; N #19 §5.)
background: >
  2.5 years software engineering and tech lead experience (enterprise, client-facing projects).
  Builds and ships LLM applications: RAG pipelines with evaluation harnesses, agentic
  workflows, NLP systems, deployed as APIs and web services. Strong on the application
  layer — a builder.

ideal_role: >
  Building and shipping defined deliverables: LLM-based applications, RAG pipelines,
  or NLP systems, from prototype through to a deployed interface. Feature and component
  work with a named handover. Consulting-adjacent or product-facing. Small-to-mid size
  company, or a specialist AI/consulting unit within a larger company where individual
  contributions are visible.

# The negative half of background / ideal_role lives here (see the note above).
# The FTE-era "5+ years senior" entry is gone (P #22 decision 3) — it fired on nearly
# every row of a senior-skewing freelance corpus, and prompt.py's ramp-up clause now
# makes the same judgement on deliverable evidence instead. The blanket "3 months
# hands-on AI engineering" string was removed from `background` (2026-07-31): it was
# the last unconditional year-count penalty on the embedding side. CLOSED (2026-07-31,
# #89): the same string was hardcoded a second time in prompt.py's ramp-up clause and
# has been removed there too — that clause now grades against the profile text this
# file supplies, so the year-count lives in neither place.
# Six entries. Four (German, classical ML, MLOps/cloud, research) have weighted bands
# in SYSTEM_PROMPT; the ownership and framing entries exist only here, unweighted.
deprioritise:
  # Kept lockstep with prompt.py's SYSTEM_PROMPT German clause — both fire bands, all
  # five carve-outs and the precedence rule, not a subset of them (#51, #54).
  - "Requires German at CEFR C1 or above as a deliberately stated, non-optional condition — the strongest form of this deprioritisation. A declared working language carrying no level (Projektsprache: Deutsch, and equally Projektsprache: Deutsch und Englisch — a second declared language does not undo the declaration) deprioritises more mildly, not as much as a stated C1+ requirement (not a penalty at all: B2 or below, no level stated and no working language declared, German implied only by job location / company name / posting language, German listed as nice-to-have / von Vorteil — an optional qualifier wins over the level — or German offered as an ALTERNATIVE to a language already held, at any level: Englisch (C1) oder Deutsch (C1) is a choice the candidate already satisfies, and oder is the opposite of the und case above, so read the conjunction word rather than counting languages)"
  - "Focused primarily on recommendation systems, forecasting, or classical ML pipelines"
  - "Heavy MLOps, Kubernetes, or cloud infrastructure as core job requirements"
  - "Primarily model research or academic role"
  - "Ownership of a platform rather than delivery within one: architecture or design
    authority over a data platform or AI platform, setting engineering standards for
    other teams, self-service platform services, central point of contact / zentrale:r
    Ansprechpartner:in, or operating and maintaining an existing platform (Betrieb,
    Überwachung, Administration, Wartung, Kapazitätsplanung) rather than building on
    it. Architecture and design decisions scoped to a single named deliverable are
    not this and carry no deprioritisation"
  - "AI, KI or LLM appears only in the framing paragraph describing the environment
    (Cloud-first KI-/LLM-Umfeld, produktive KI-Services) or as development tooling
    (Einsatz moderner KI-Tools, KI-gestützte Entwicklungsansätze — using AI assistants
    to write code), while the Aufgaben themselves contain no model, prompt, retrieval,
    evaluation or agent work"

# Feeds BOTH the ranking query (_build_profile_text) and the eval prompt (build_prompt),
# so a title added for reach also moves the query vector. #89 asked whether the three
# Python-backend titles below dilute it. MEASURED (2026-07-31, 58-listing live pool,
# production defaults) rather than argued, because the finding could not be settled by
# reading: with the three titles removed the query vector moves only 0.9931 cosine, and
# 22 of the top 25 are the same listings. The 3 that swap all sit inside the 0.866–0.874
# plateau, where adjacent ranks differ by ~0.0005 — so WHICH 25 you get there is noise,
# not a preference the ranking is expressing.
#
# Kept, deliberately. The swap is not free — the titles pull in a CAD/3D "Senior Python
# Engineer" and a "Data Engineer - ML" while pushing out an "AI Engineer (Intelligente
# Suche)" and a "KI Entwickler" — but the fix for that is the rank cut, not the titles:
# at top_n 30 all six of the swapped listings are evaluated and the trade disappears.
# Removing the titles would also cost the backend-titled contract postings they exist to
# reach, which is the coverage #88 added them for. See the top_n issue.
target_roles:
  - "ML Engineer"
  - "AI Engineer"
  - "Machine Learning Engineer"
  - "AI Application Engineer"
  - "GenAI Engineer"
  - "LLM Engineer"
  - "AI Software Engineer"
  - "Python Backend Engineer"
  - "Python Backend Developer"
  - "Backend Engineer"

# `skills.strong` feeds BOTH the ranking query (_build_profile_text, embedder.py:56)
# and the eval prompt (build_prompt, prompt.py:118), so adding a skill changes which 25
# rows reach the model at all, not merely how they are judged. #100 added the last three
# entries below — all held, all previously invisible to the evaluator, all implicated in
# D1 (#3004625), where they were reported as gaps.
#
# MEASURED (2026-08-04, 131-listing live freelancermap fetch → 54 past the hard filter,
# ranking stage only, no LLM calls) rather than argued, on the same terms as the
# target_roles measurement above: the query vector moves 0.9936 cosine, and 24 of the
# top 25 are the same listings.
#
# The one swap is NOT noise, and is recorded rather than averaged away. Entering:
# `3030521` "Fullstack Development – AI/Cloud Anwendungen" (BLUECHILLED), 0.8666 →
# 0.8773 — a +0.0107 move, an order of magnitude above the +0.0004 of the listing it
# displaced (`3028965` "Data Engineer – Machine Learning", which rose too and was simply
# overtaken). So the three additions pulled in a FULLSTACK seat, which is the exact
# targeting cost the handoff flagged for the React/TypeScript question — arriving here
# instead, at one row. Rank 23–28 sit at 0.8772/0.8756/0.8748/0.8741/0.8718/0.8709, so
# the cut is not the flat plateau target_roles found; adjacent ranks differ by ~0.001.
#
# LIMIT: measured without the feedback centroid. `data/jobscout.db` is empty locally, so
# `get_interested_descriptions()` returns nothing and `feedback_weight: 0.2` contributes
# zero in both arms. It is identical across arms and cannot bias the delta, but it can
# move which listings sit near the rank-25 boundary in production.
skills:
  strong:
    - Python
    - RAG systems
    - LangChain / LangGraph
    - LLM application development
    - "LLM evaluation (LangSmith, eval sets, LLM-as-judge, regression suites)"
    - "agentic systems"
    - Prompt engineering
    - Vector databases (Pinecone, ChromaDB)
    - "FastAPI / REST API development"
    - "Claude Code / agentic development workflows"
    - Sentence Transformers
    - HuggingFace ecosystem
    - "NLP pipelines"
    - "OpenAI API, Groq, Cohere embeddings & rerank"
    - MLflow
    - "EU AI Act Art. 50 / AI compliance implementation"
    - "adversarial and prompt-exposure testing"
  working_knowledge:
    - Docker / Docker Compose
    - "GitHub Actions CI/CD"
    - "GCP (Cloud Run, Cloud Run Jobs, GCS)"
    - SQL
    - "pytest"
    - "Streamlit"

location:
  target_countries: ["Germany", "Deutschland"] # only surviving location field

# Negotiating position. NO PIPELINE CONSUMER — no filter, no ranking, no prompt
# reads this, and that is deliberate, not dead config awaiting deletion. A rate
# floor is a position held independently of this tool, and profile.yaml is the
# single source of truth for preferences. Hourly and daily are stated separately
# and never converted: a Tagessatz records what you would actually quote, and
# deriving one from the other would fabricate it.
#
# "NO PIPELINE CONSUMER ... deliberate" is now an OPEN QUESTION, not a settled one —
# see #128. The absence of a consumer is what made #100's corrections provably free,
# and also what let a floor sit above its target through a full green test run. A
# field nothing reads has no way to be wrong, and therefore no way to be right.
# The ordering guard that would have caught it is #127.
#
# All four values were resolved together in #100, as a unit, because correcting
# minimum_daily alone produced minimum_daily > target_daily. 800 was the intended
# TARGET and had been typed into the floor field; 700 is a NEW floor, not a
# restoration of the 450 that stood before — a hard walk-away at 800 is wrong for a
# first engagement, where a reference outweighs the margin, and an offer at 750 would
# be taken. That 800 matches target_hourly over a standard day is evidence about what
# was meant when it was typed, NOT a derivation: the rule above governs what the code
# may compute, and says nothing about what the maintainer may recall.
rate:
  minimum_hourly: 50 # Stundensatz floor (EUR/hour)
  target_hourly: 100 # hourly negotiation target
  minimum_daily: 700 # Tagessatz floor — STATED, never derived
  target_daily: 800 # daily negotiation target
  currency: "EUR"

dealbreakers:
  exclude_companies: []
  exclude_keywords:
    - "Unpaid"
    - "Volunteer"
    - "audio"
    - "Big Data"
    - "Recommendation Engine"
    - "Empfehlungssystem"
    - "Computer Vision"
    - "Bildverarbeitung"
    - "Robotics"
    - "Robotik"
  require_any_keyword:
    - "machine learning"
    - "ML"
    - "AI"
    - "deep learning"
    - "NLP"
    - "LLM"
    - "data science"
    - "RAG"
    - "LangChain"
    - "agentic"
    - "generative AI"
    - "LLM application"

  # Engagement forms never wanted. A blocklist, so contracting AND unknown both
  # pass — an allowlist would silently delete every unknown row the day a source
  # that cannot determine the engagement form is added. Empty rejects nothing.
  exclude_contract_types: ["employee_leasing", "permanent_position"]

  # Remote floor. A job whose remote_percentage is below this is rejected; one at
  # or above it passes without a country check. A job with no percentage is not
  # rejected for remoteness but still faces target_countries. null switches the
  # floor off, leaving target_countries to decide — except for fully-remote work,
  # which is exempt from the country check either way.
  minimum_remote_percentage: 100

# Free-text search terms sent to freelancermap — and the adapter's ONLY coverage
# lever, not merely a targeting convenience. The anonymous view returns 22 results
# per query and nothing reaches result 23 (pagination was measured and refuted, not
# left unverified), so the adapter issues one request per term below and unions the
# results. Adding a term is how you see more of the market; removing one shrinks the
# corpus. German terms are seeded from the start because the source is DACH and its
# corpus measures 81% German — dropping them would cost coverage, not just focus.
#
# One request per entry, capped by config.freelancermap_max_requests.
freelancermap_queries:
  - "Machine Learning"
  - "LLM"
  - "Generative AI"
  - "Maschinelles Lernen"
  - "KI"
  - "RAG"
  - "LangChain"
  - "AI Engineer"
  - "Agentic"

# Minimum LLM match score (1–10) to include a job in the email digest.
# Jobs below this threshold are still written to the daily digest file.
#
# 5, raised from 4 on 2026-07-31. This restores the pre-pivot value: it was dropped
# to 4 while the FTE-era rubric was being rewritten and nobody knew which way the
# distribution had moved, and 4 outlived that reason. Two things settled it. The
# rubric now grades a German penalty (#54, #63, #65), and a -1 band lands rows
# squarely on the 4/3 boundary the gate sits on, so 4 was the least stable place to
# put it. And the last two validation runs both show the 4-band is where the bulk
# sits — #65's 20-listing run scored `1x8, 2x7, 3x6, 2x5, 6x4, 3x3, 2x2`, so a gate
# at 4 emails 14 rows and a gate at 5 emails 8. That cut is the point: this tool
# exists to return fewer, better matches, and everything below the gate is still
# written to the daily digest file rather than lost.
#
# Independent of `reeval_below` (the re-evaluation floor, config.py) since #45 —
# raising this no longer drags that with it.
email_min_score: 5
