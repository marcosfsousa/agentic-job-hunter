  instead of the live page's 22, captured 2026-07-22.

  The script-tag wrapper is deliberately NOT flattened to bare JSON: the adapter's job
  starts at finding the ProjectSearch payload among the other react-on-rails components
  on the page, so a JSON fixture would skip the step under test. The HeaderSearch
  component below is a decoy for exactly that reason.

  Field shapes are as measured against the live payload, including the ones that
  contradicted the earlier written research:

    * `url` is null on every row. The project path lives in `links.project`.
    * `country` is an OBJECT ({id, name, iso2, nameDe, nameEn}), not a string.
    * `city` is free text the poster typed — often a real city, sometimes "D".
    * `description` is editor HTML (<br />, <div class="ql-editor">, <ul><li>),
      not the plain prose the research described.
    * `beginningMonth` / `beginningYear` are STRINGS ("01", "2024"), not integers.
    * `budget` is null rather than [] when absent.

  Per-project field sets exercise the mapping branches rather than reproducing one
  real page verbatim:

    3026737 — contracting, 0% remote, no beginningText, "D" as city, <br /> markup
    3026337 — contracting, 100% remote, "ab sofort", the one row that survives the
              hard filter
    3026469 — employee_leasing, 60% remote, exact-day start, endcustomer True
    3026169 — unrecognised contract type, month-granular start, POPULATED budget
              (no live row has ever carried one; it exists to pin the never-parse
              rule), <div class="ql-editor"> + <ul><li> markup
-->
