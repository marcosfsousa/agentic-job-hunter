  - id: "3004625"
    label: false-gaps
    human_score: 6.5
    human_score_approximate: false
    expected_band: marginal
    tool_score: 6
    baseline: pass_with_known_defect
    defects: [D1]
    exercises: false gaps (B1)
    rules: [B1]
    issues: [97]
    live_rescorable: true
    text_provenance: excerpt
    live_baseline:
      # ⚠️ STALE — RE-RECORD BEFORE THIS BRANCH MERGES. See "THIRD OCCURRENCE" in the
      # header. Values below are #135's; they do NOT describe the prompt this branch ships.
      #
      # TWO recordings are superseded here, not one, and the next one is a measurement of
      # a THIRD input rather than a correction of the second:
      #   #98/#135  eb00281 / f273254967a1  n=3   [9,8,8]  penalty_ramp_up_risk 3/3
      #   #97       e9e9e99 / 4b578b5b4acf  n=10  [8,8,8,8,9,8,8,8,9,8]  ramp_up 9/10
      #   pre-both  cbfa1a6 / 330573c8d178  n=3   [9,8,9]  penalty_ramp_up_risk 1/3
      n: 3
      prompt_commit: eb00281
      input_fingerprint: f273254967a1
      temperature: 0.0
      recorded: 2026-08-04
      scores: [9, 8, 8]
      fired:
        boost_core_stack: 3
        boost_llm_ownership: 3
        boost_visible_contribution: 3
        penalty_ramp_up_risk: 3
    sequencing_constraint: >-
      Record this baseline BEFORE #100 lands. If #100 adds `React` / `TypeScript` to
      `working_knowledge`, this fixture's expected `gaps` changes — and a baseline that
      moves on a config change rather than a code change loses the attribution that makes
      it worth having.
    sub_band_defect: >-
      Three of four stated `gaps` were false — skills present in the CV reported as
      absent. The defect is in the `gaps` field, not in the number: 6 and the human's
      6.5 are both `marginal`, so no band assertion can see it. Kept in the corpus
      because #97 needs the case; asserted by #97 against the field, not the band.
      RESOLVED IN TWO PARTS, both landed. The three false entries were `MLflow`,
      `EU AI Act Art. 50` and `adversarial and prompt-exposure testing` — held skills
      that `profile.yaml` did not list, so they were false about the CANDIDATE and true
      about the PROFILE, which is the only thing the model is shown. #100 added them
      and they are gone from all three live draws; #97 then capped the field at 5 and
      required each entry to name the profile section it is absent from or conflicts
      with. `tool_score: 6` is the ORIGINAL pre-#95 recording and is deliberately not
      re-recorded here — the band it implies is still `marginal`, and re-recording it
      is a separate act from fixing the defect. `test_gaps_are_capped_and_grounded_in_
      the_profile` is the assertion this row was kept for.

  - id: "3028920"
    label: inferred-vs-declared-language
    human_score: 6.0
    human_score_approximate: false
    expected_band: marginal
    tool_score: 5
    baseline: pass_with_known_defect
    defects: [D4]
    exercises: inferred vs. declared language (B2)
    rules: [B2]
    issues: [98]
    live_rescorable: true
    # `full`, not `excerpt`, and this is the one case where that is not negotiable:
    # D4 fires on an ABSENCE — German inferred from the location, relabelled "declared",
    # and penalised on a posting that declares no German requirement. An excerpt cannot
    # demonstrate an absence. A scorer handed two paragraphs finds no declared
    # requirement because it was handed two paragraphs, so an excerpt would manufacture
    # the pass. Text not yet retrieved; the row stays and the live test skips until it
