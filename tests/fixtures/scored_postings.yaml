  - id: "3004625"
    label: false-gaps
    human_score: 6.5
    human_score_approximate: false
    expected_band: marginal
    tool_score: 6
    baseline: pass_with_known_defect
    defects: [D1]
    exercises: false gaps (B1)
    rules: [B1]
    issues: [97]
    live_rescorable: true
    text_provenance: excerpt
    live_baseline:
      # Re-recorded against the MERGED #97 x #98 prompt, at n=10. Superseded recordings,
      # each a measurement of a DIFFERENT input rather than an earlier attempt at this one:
      #   #98/#135  eb00281 / f273254967a1  n=3   [9,8,8]  ramp_up 3/3
      #   #97       e9e9e99 / 4b578b5b4acf  n=10  [8,8,8,8,9,8,8,8,9,8]  ramp_up 9/10,
      #                                           penalty_german_language 1/10
      #   pre-both  cbfa1a6 / 330573c8d178  n=3   [9,8,9]  ramp_up 1/3
      #
      # n=10, NOT 3 — a fact about the SAMPLER, not about any of the three prompts. An n=3
      # recording read `penalty_ramp_up_risk` at 1/3 before and 3/3 after #97's edit, which
      # looks like a gaps-field change reaching into an unrelated rule. It is not: at n=10
      # per arm in one process, the pre-#97 prompt fires it 7/10 and the post-#97 prompt
      # 9/10, Fisher exact two-tailed p=0.58. #135 then saw the IDENTICAL illusory
      # 1/3 -> 3/3 on this row from an unrelated German-clause edit. Three draws cannot
      # tell an ~80% rule from a certainty, and every n=3 recording above is of that rule.
      #
      # PRE-REGISTERED 7-9 OF 10, MEASURED 10/10 — AND THE BAND WAS THE THING THAT WAS
      # WRONG. Fisher exact against the 9/10 it was derived from: p = 1.0000. One
      # discordant draw in twenty; the test cannot separate the arms at all. The band was
      # drawn as a range around a POINT ESTIMATE of a rule already sitting at 9/10, so it
      # had no headroom above and one ordinary draw read as detection. Derive a threshold
      # from the rule's measured VARIANCE instead — written up on #130, with the n=3
      # discussion it is one order of magnitude up from. So the 10/10 is recorded as what
      # it is, a draw, and NOT read as the two edits interacting.
      #
      # `penalty_german_language` is absent from all ten draws, holding the other half of
      # the pre-registration.
      #
      # HONEST CONSEQUENCE OF RECORDING WHAT WAS DRAWN: at 10/10 this rule re-enters
      # `test_excerpt_fires_the_rules_it_did_before`'s `k == n` drift check, where 9/10 had
      # correctly excluded it. An ~80% rule asserted every-draw will flake. Not rounded
      # down to dodge that — inventing a number to manage a threshold is the failure this
      # whole block exists to prevent, and #130 owns the threshold question.
      #
      # THIS ROW IS NOT THE ONE THAT ACTUALLY FLAKES, AND SAYING SO HERE ALONE WAS WRONG.
      # `penalty_ramp_up_risk` is recorded 10/10 on #3025628 as well, and measurement puts
      # the failures there: 12 consecutive live draws of that test gave 3 failures on
      # #3025628 against 12/12 clean on this row. See the same warning on that block; it
      # carries the numbers. The first version of this comment named only this row, which
      # pointed the reader at the wrong risk — found in review, corrected here rather than
      # deferred, because a disclosure that names the wrong row is worse than none.
      n: 10
      prompt_commit: aff3d28
      input_fingerprint: f871dd69729e
      temperature: 0.0
      recorded: 2026-08-04
      scores: [8, 8, 7, 8, 8, 8, 8, 7, 8, 8]
      fired:
        boost_core_stack: 10
        boost_llm_ownership: 10
        boost_visible_contribution: 10
        penalty_ramp_up_risk: 10
    sequencing_constraint: >-
      Record this baseline BEFORE #100 lands. If #100 adds `React` / `TypeScript` to
      `working_knowledge`, this fixture's expected `gaps` changes — and a baseline that
      moves on a config change rather than a code change loses the attribution that makes
      it worth having.
    sub_band_defect: >-
      Three of four stated `gaps` were false — skills present in the CV reported as
      absent. The defect is in the `gaps` field, not in the number: 6 and the human's
      6.5 are both `marginal`, so no band assertion can see it. Kept in the corpus
      because #97 needs the case; asserted by #97 against the field, not the band.
      RESOLVED IN TWO PARTS, both landed. The three false entries were `MLflow`,
      `EU AI Act Art. 50` and `adversarial and prompt-exposure testing` — held skills
      that `profile.yaml` did not list, so they were false about the CANDIDATE and true
      about the PROFILE, which is the only thing the model is shown. #100 added them
      and they are gone from all three live draws; #97 then capped the field at 5 and
      required each entry to name the profile section it is absent from or conflicts
      with. `tool_score: 6` is the ORIGINAL pre-#95 recording and is deliberately not
      re-recorded here — the band it implies is still `marginal`, and re-recording it
      is a separate act from fixing the defect. `test_gaps_are_capped_and_grounded_in_
      the_profile` is the assertion this row was kept for.

