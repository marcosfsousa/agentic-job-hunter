  - id: "3004625"
    label: false-gaps
    human_score: 6.5
    human_score_approximate: false
    expected_band: marginal
    tool_score: 6
    baseline: pass_with_known_defect
    defects: [D1]
    exercises: false gaps (B1)
    rules: [B1]
    issues: [97]
    live_rescorable: true
    text_provenance: excerpt
    sequencing_constraint: >-
      Record this baseline BEFORE #100 lands. If #100 adds `React` / `TypeScript` to
      `working_knowledge`, this fixture's expected `gaps` changes — and a baseline that
      moves on a config change rather than a code change loses the attribution that makes
      it worth having.
    sub_band_defect: >-
      Three of four stated `gaps` were false — skills present in the CV reported as
      absent. The defect is in the `gaps` field, not in the number: 6 and the human's
      6.5 are both `marginal`, so no band assertion can see it. Kept in the corpus
      because #97 needs the case; asserted by #97 against the field, not the band.

  - id: "3028920"
    label: inferred-vs-declared-language
    human_score: 6.0
    human_score_approximate: false
    expected_band: marginal
    tool_score: 5
    baseline: pass_with_known_defect
    defects: [D4]
    exercises: inferred vs. declared language (B2)
    rules: [B2]
    issues: [98]
    live_rescorable: true
    # `full`, not `excerpt`, and this is the one case where that is not negotiable:
    # D4 fires on an ABSENCE — German inferred from the location, relabelled "declared",
    # and penalised on a posting that declares no German requirement. An excerpt cannot
    # demonstrate an absence. A scorer handed two paragraphs finds no declared
    # requirement because it was handed two paragraphs, so an excerpt would manufacture
    # the pass. Text not yet retrieved; the row stays and the live test skips until it
    # lands. Do not substitute an excerpt.
    text_provenance: full
    sub_band_defect: >-
      German was inferred from the location and then relabelled "declared" and penalised —
      an adherence failure against a rule that already carves out location-inferred German.
      Costs 1–2 points, and 5 and the human's 6 are both `marginal`, so the band cannot
      see it. #98 asserts it through the trace.

  - id: "2999393"
    label: non-engineering-deliverable
    human_score: 6.5
    human_score_approximate: false
    expected_band: marginal
    tool_score: 7
    baseline: fail
    defects: []
    # `wave-d`, not `D2`: the D-numbers elsewhere in this file are § 1's defect ids,
    # and "Wave D2" in § 6 means the second Wave D item. Two numbering schemes, one
    # letter — do not collapse them.
    exercises: non-engineering deliverable (Wave D2)
    rules: [wave-d]
    issues: []
    live_rescorable: true
    text_provenance: excerpt
    expressibility_gap: >-
      The workload figure this case turns on is a card field, and it cannot reach the
      fixture today: `JobListing` (models.py) has no workload field at all — not the
      adapter, not the model, not the prompt. Testing the Wave D dimension here is a
      `JobListing` change and belongs to a new issue, not to this fixture. Filed as
      **#110** (`discovered`), scoped to making the value expressible and explicitly
      not to scoring it.
    notes: >-
      Crosses `apply` -> `marginal`, so it asserts normally and is a genuine baseline
      failure. But the rule it exercises is Wave D2, which is UNFILED and UNSCOPED —
      nothing in Waves A-C will move it. Record it; do not treat it as a target and do
      not fix it in passing. Wave D is where the scope discussion happens, and this case
      is the evidence that discussion will need.

  # --- controls: no recorded tool score ---------------------------------------
  # § 6 leaves the Tool column empty for these six. Four are not freelancermap rows
