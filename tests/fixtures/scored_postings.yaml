# Hand-scored postings — the A2 regression corpus (#96).
#
# WHAT THIS IS
# The fourteen labelled cases from docs/jobscout_scoring_handoff.md § 6: for each, the
# id of a posting, the score a human gave it, the band that score falls in, and the
# specific scoring rule the case exercises. Eight of them are the confirmed defects of
# § 1 (D1–D6); six are controls the tool has never scored.
#
# WHY THE POSTING BODIES ARE NOT HERE
# This repository is public and linked from a CV, and the postings are third-party
# copyrighted text naming real contact persons. `tests/fixtures/scored_postings/` is
# therefore gitignored and holds the text locally only; this manifest is the committed
# half. That is the same rule `data/jobscout.db` lives under, for the same reason, and
# it has the same mechanical tripwire — see `test_no_scored_posting_text_is_tracked`
# in tests/test_repo_invariants.py. `contract_evaluation_log.md`, the source the human
# scores come from, stays out of the repo entirely (handoff § 8).
#
# WHAT THIS MANIFEST CARRIES — and it is a short list
# Per case: the id, the human score, the band, the rule it exercises, and the tool
# score, plus the harness metadata that hangs off those. Nothing else.
#
# NO POSTING TEXT. Not a quoted clause, not a paraphrase, and not a description of
# what a body contains. The last two are the ones worth spelling out, because they
# look harmless: B2's test turns on the word `oder`, and a described disjunction is
# not a disjunction. A manifest that summarised the clause would read as though it
# documented the case while testing nothing — worse than the silence, because the
# silence is honest about where the input lives.
#
# The verbatim clauses live in the gitignored fixture bodies under
# `tests/fixtures/scored_postings/`, contact persons stripped. Guidance for
# building those bodies lives there too (`HOW-TO-BUILD.local.md`, also gitignored),
# because that guidance is itself a description of posting content.
#
# This is a rule about the committed file, not about the fixtures: the excerpts may
# and must quote whatever their rule reads. It is the manifest that stays clean.
#
# Enforced, not merely stated: `test_the_manifest_carries_no_posting_text` allows only
# a fixed set of per-case keys, so the field that would carry a description back in —
# some helpful `excerpt_must_keep` — fails the suite rather than passing review.
#
# THE TWO SHAPES, AND WHAT EACH BUYS
#   * metadata-only (all fourteen) — drives the offline baseline. The assertion is
#     `band(tool_score) == expected_band` against the score the tool *recorded*, so it
#     needs no posting text, no network and no API key. This is what runs in CI.
#   * live-rescorable (`live_rescorable: true`) — five cases. Four hold excerpt text today;
#     #3028920 is waiting on its full posting and skips until it lands.
#     `JOBSCOUT_LIVE_EVAL=1 pytest tests/test_scored_postings.py` re-scores those
#     through the real evaluator and asserts the same bands against a fresh draw.
#     This is the mode Wave C measures its calibration changes with — subject to the
#     fidelity limit below, which is what an excerpt costs.
#
# WHERE THE BODIES LIVE, AND HOW A WORKTREE REACHES THEM. Gitignored files do not
# follow a `git worktree`, so `tests/fixtures/scored_postings/` is absent in every
# worktree and every fresh clone — the directory resolves *into* the checkout that is
# running. Set `JOBSCOUT_FIXTURE_DIR` to one copy held outside any checkout and every
# checkout reads that one (#122); unset, the path is the module-relative default and
# nothing about CI changes. The main checkout's `.env` is the place to set it, since
# the harness loads that `.env` even from a worktree (#146).
#
# EXCERPT FILE FORMAT — `tests/fixtures/scored_postings/<id>.md`, gitignored:
#
#     ---
#     title: <the real one>
#     company: <the real one — unanonymised>
#     location: <the real one — unanonymised>
#     url: https://www.freelancermap.de/projekt/...
#     remote_percentage: 100        # optional; omit if the posting states none
#     provenance: excerpt           # required; must match the case's text_provenance
#     ---
#     Only the clauses the case's rule reads. Nothing else.
#
# What to keep and what to strip is a description of posting content, so it lives
# with the fixtures rather than here — `scored_postings/HOW-TO-BUILD.local.md`,
# gitignored, per case. The two rules worth restating without any case attached:
# keep the company and the location unanonymised (`build_prompt` sends both, and
# for some cases the identity IS the signal under test), and strip named
# individuals — contact persons, recruiter names, signatures — which are the real
# privacy exposure and which no scoring rule reads.
#
# FIDELITY LIMIT — what a live re-score against an excerpt is and is not
# An excerpt-scored fixture is NOT the conditions the human score was assigned under.
# The human read the whole posting; the scorer sees a fragment. So a live result on a
# `provenance: excerpt` fixture is evidence about **the rule** — did the clause fire,
# in the direction and roughly the magnitude the rule says — and not about **the
# score**. Do not read a passing excerpt as "the tool would now score this posting
# correctly", and do not tune a rule until an excerpt reproduces a human number.
# This is a real limit and not a caveat to be engineered away: the fix for it would be
# keeping the full text, which is what the excerpting rule above exists to prevent.
# `text_provenance` records the shape per case, the excerpt file repeats it in its front
# matter, and the harness fails if the two disagree.
# The offline baseline is unaffected — it asserts against the recorded tool score, which
# was produced from the full posting in a real run, and it never reads the text at all.
#
# UPDATING AFTER A FIX LANDS
# `baseline: fail` is a ratchet. The band test xfails those cases *strictly*, so once
# C1/C3 move a case into its band the xfail turns into an XPASS and the suite goes red
# until someone looks. Do not fix a score by editing `expected_band` — the band is the
# human's judgement, not the tool's.
#
# CORRECTED 2026-08-04 (#96 amendment): this paragraph used to say the fix "re-records
# `tool_score` and flips `baseline` to `pass`". Both halves were wrong. `pass` is not a
# legal value — `test_every_baseline_value_is_one_of_the_three` allows only `fail`,
# `pass_with_known_defect` and `unrecorded` — and the prose was wrong rather than the
# test: a baseline is a HISTORICAL RECORD and does not flip when a fix lands, because
# then it stops being a baseline. `tool_score` is likewise immutable. It is the only
# surviving record of what the scorer did on real postings, and every § 1 defect was
# diagnosed from it; overwriting it with excerpt scores would destroy the evidence base
# to make the fixtures tidier. What a fix updates is `live_baseline` — see below.
#
# LIVE_BASELINE — the excerpt record, and why it holds FREQUENCIES rather than a draw
# Live re-scores of `provenance: excerpt` rows are compared on WHICH RULES FIRED, never
# on the score or the band. Storing a score would make the comparison band-level again
# under a new name, which is the failure the #96 amendment exists to fix.
#
# It records a DISTRIBUTION, not a draw. Recording one draw is known to be wrong: two
# pinned-temperature runs of #3018325 with no rule change between them put
# `penalty_cloud_core` at 4/10 and then 0/10. A single-draw "before" would have made
# the next prompt edit look like it moved a rule it never touched.
#
#   n                  draws taken; the denominator for every count in `fired`
#   fired              rule id -> how many of the n draws it fired in, as an INTEGER.
#                      Not "9/10": n is stated once on the row, so a k/n string would
#                      encode the denominator twice and let the two drift, and a string
#                      cannot be compared to a threshold without parsing it first.
#   scores             the raw score from each draw, in order. len(scores) == n is
#                      asserted. Kept raw because which aggregate matters depends on the
#                      question — #126 asks whether the score moved WITH the fired set,
#                      #130 asks about the distribution's shape.
#   temperature        what it was sampled at. Recorded rather than assumed, because the
#                      pipeline spent its life at an unpinned 1.0 and nothing said so.
#   prompt_commit      the commit whose prompt PRODUCED these numbers. Human-readable
#                      provenance, and the value a reader checks out to reproduce them.
#                      This is NOT "repo HEAD when measured", which is what it used to
#                      say and what it collected: a baseline re-measured while writing a
#                      prompt edit is taken against a working tree, so repo HEAD is the
#                      commit BEFORE the edit. #135 recorded all three rows that way and
#                      the result read as a regression — `fa6c59c`'s rubric produces
#                      10/10 German-penalty draws against rows recording 0/10, so anyone
#                      reproducing would conclude the fix had failed or the numbers were
#                      invented. Nothing catches it: the staleness guard reads the
#                      fingerprint, never this. So record the SHA the edit becomes, once
#                      it has one — amend after committing rather than before.
#   input_fingerprint  THE GUARD. A hash of everything `build_prompt` sends the model —
#                      SYSTEM_PROMPT and profile.yaml together, taken over the rendered
#                      prompt rather than an enumerated field list, so a field
#                      `build_prompt` starts sending later is covered without anyone
#                      remembering. `test_live_baselines_are_not_stale` compares it
#                      against current and fails when they differ.
#
# The fingerprint exists because a prompt SHA is not enough. #100 changed
# `skills.strong`, `build_prompt` sends `skills.strong` on every call, and it silently
# invalidated a baseline being measured on another branch — the second time a merge to
# main has done that (#111 was the first). Neither was blocked on a decision, so #117's
# draft convention does not catch the class: the merge was legitimate and simply moved
# an input. Catching it used to depend on somebody noticing. Now the suite does.
#
# THIRD OCCURRENCE — AND THE FIRST ONE CAUGHT BEFORE THE FACT (#97 x #98, 2026-08-04).
# #135 landed #98's German clause on main while #97's gaps spec was in flight. Both edit
# SYSTEM_PROMPT, so each invalidated the other's baselines. Unlike #111 and #100 this did
# not slip through: the guard fired on the merge attempt, BEFORE the merge, and the merge
# was stopped rather than discovered later. That moves the class from open to handled,
# which is why this section now reads as a record rather than a warning.
#
# What is NOT fixed, because it cannot be: two branches touching the rubric cannot both
# be measured in advance, and whichever merges second always pays a re-record. That cost
# is inherent to measuring against a prompt. The avoidable part is SEQUENCING —
# rubric-touching PRs merge ONE AT A TIME, and two should never sit ready at once. That
# is the convention that would have avoided this one; it lives with the merge rules
# (#117 / CLAUDE.md), not here.
#
# PRE-REGISTERED EXPECTATION FOR THE MERGED-PROMPT RE-RECORD (written 2026-08-04, BEFORE
# any draw against the merged prompt existed — committed first so the result reads the
# same whichever way it falls). The merged prompt is the first to carry TWO independent
# edits to the same rubric, so what is being tested is whether they INTERACT:
#
#   1. `penalty_german_language` on #3018325 stays at 0/10. #98 drove it 10/10 -> 0/10
#      over 20 draws against a pre-registered threshold, and the #97 gaps spec names no
#      language rule. `must_not_fire` already asserts this, so a non-zero count is a
#      RED SUITE, not a note.
#   2. `penalty_german_language` on #3004625 stays at or below 1/10, where #97 recorded
#      it. It is not a `must_not_fire` row and 1/10 asserts nothing either way.
#   3. `penalty_ramp_up_risk` on #3004625 lands in roughly 7-9 of 10. Both prompts
#      measured ~80% and the two edits are unrelated to it; anything at or below 4/10,
#      or a flat 10/10, is the interaction this pre-registration exists to detect.
#   4. The gaps assertions (cap <= 5, grounding majority) hold on all four live rows, as
#      they did on #97's own prompt.
#
# If 1 or 3 moves, the two edits interact and that is a FINDING with an issue attached —
# not a nuisance to be re-measured away. Recorded before the run rather than after,
# because a prediction written afterwards is a story.
#
# OUTCOME, measured 2026-08-04 at fingerprint f871dd69729e, n=10 per row. The prediction
# above is left exactly as written; this is appended, never edited into agreement.
#
#   1. HELD.   penalty_german_language absent from all 10 draws on #3018325.
#   2. HELD.   absent from all 10 draws on #3004625 (predicted <=1/10).
#   3. MISSED — AND THE BAND WAS WRONG, NOT THE RULE. Measured 10/10 against a predicted
#      7-9. Fisher exact two-tailed against the 9/10 the band came from: p = 1.0000. A
#      band drawn as a range around the POINT ESTIMATE of a rule already at 9/10 has no
#      headroom above it, so a single ordinary draw reads as detection. Thresholds must
#      be derived from measured VARIANCE. Written up on #130; not an interaction.
#   4. HELD (cap). 1-3 gaps per draw on every row, never above 5.
#
# THE MECHANISM HELD WHERE IT MATTERED. Items 1 and 2 were the reason to pre-register at
# all — whether #98's carve-out survived #97's gaps spec — and German was absent across
# twenty draws exactly as predicted. One of four bands was constructed badly; that is not
# the same as the discipline failing. It is also what made item 3 legible: because the
# band was public BEFORE the number existed, 10/10 could be checked against it and
# dismissed as an artefact. Written afterwards, 10/10 reads as clean confirmation and
# nobody runs the test at all.
#
# UNPREDICTED, found because the run recorded everything rather than only what was asked:
# penalty_german_language fires 2/10 on #3025628 — German named as a PREFERENCE, which is
# neither a requirement nor the disjunction #98 carved out. A real gap in #98, tracked as
# #139, and NOT a blocker for #97: the behaviour arrived with #135 and is already on main.
#
# A stale baseline is a FAILURE in the offline shape test and a SKIP in the live
# comparison — comparing a fresh draw against a "before" that describes an input the
# model is no longer given is worse than not comparing at all. Do not edit a
# fingerprint to match; re-measure.
#
# RECORDED `tool_score` VALUES ARE SINGLE DRAWS, NOT MEASUREMENTS
# The second fidelity limit, and it applies to the OFFLINE baseline — the one the
# clause above says is unaffected by excerpting. Until the temperature pin (#129),
# `messages.create` set no `temperature`, so the API default of 1.0 applied to every
# production run. Every `tool_score` in this file is therefore ONE SAMPLE from a
# high-variance distribution, and the § 1 defects were diagnosed from those samples.
#
# Demonstrated rather than asserted: `penalty_mlops_core` fired 1/1 at temperature 1.0
# and 0/10 at temperature 0 on #3018325. Something recorded as a rule misfiring was a
# sample. And pinning does not make a single draw safe either: across two pinned runs
# of the same fixture with no rule change between them, `penalty_cloud_core` measured
# 4/10 and then 0/10. Single draws were never going to be stable — the corpus had no
# way to know, which is why `live_baseline` records n draws rather than one.
#
# The diagnoses themselves largely stand: several rest on the model's own prose (it
# NAMED the platform-ownership problem, it called the onsite week "a minor friction"),
# not on the number alone. That evidence is unaffected by sampling. What is affected is
# the numbers — which cases sit how far outside their band, and therefore which defects
# still reproduce. Re-measurement is #130.
#
# This is why `tool_score` is immutable rather than merely stale: it records what the
# scorer did at the temperature production was actually running, which is the only
# evidence the original diagnoses were made from. New measurements go in
# `live_baseline`; they do not overwrite this column.
#
# STARVATION RUNS IN BOTH DIRECTIONS — demonstrated 2026-08-04, not merely asserted
# The fidelity limit above states the excerpt caveat as a caution. The baseline run
# measured it: #3004625 scored **9** on its excerpt against 6 on the full posting, and
# #2999393 scored **1** against 7. Strip the context and there is nothing left to
# penalise, or nothing left to reward — two points, opposite signs, one cause. Worse,
# a band can be right for unrelated reasons: #3018325 landed in `hard_skip` *before*
# either fix existed, carried there by penalty_mlops_core, penalty_cloud_core and
# penalty_ramp_up_risk while both rules under test fired wrongly. This is why band
# assertions now run on `provenance: full` rows only.
#
# `pass_with_known_defect` is the other marking, and it is NOT a ratchet. Those two
# assertions are xfailed *non-strictly* with `BAND_BLIND_REASON`, so they report XPASS:
# the assertion runs, passes, and decides nothing, because the defect does not move
# magnitude. Do not "fix" the XPASS by removing the marker — that would restore a green
# tick that means nothing. It comes off when #97 and #98 add assertions that can see the
# defect, and not before.
#
# COVERAGE IS PARTIAL — a green suite is not full coverage
# § 6 lists fourteen cases and this manifest carries all fourteen, but only five hold
# posting text, and one of those five is still waiting for it. Everything else is a
# metadata-only row driving the offline baseline. Outstanding, and who holds each:
#
#   #3028920 full text (the Skills block)         maintainer — retrieval
#   case10 (7.5, apply)                           maintainer — retrieval
#   case11 (7, apply)                             maintainer — retrieval
#   case09 (8, apply)                             maintainer — from materials kept 27 Jul;
#                                                 the provider closed the posting
#   #3008147, #3003311, #3027041                  maintainer — retrieval
#   #3028352, case13, #3027789                    maintainer — retrieval
#
# NOT SUFFICIENT TO VALIDATE C3 (#103)
# Every case here is an over-scoring failure or a same-band defect. At least two
# `apply`-band positive controls must be *scorable* before C3's rebalancing is validated
# against this corpus — otherwise a scorer that scores everything low passes it. Three
# such rows exist (`expected_band: apply` — case09, case10, case11) and none has text or
# a recorded tool score, so today the count of usable positive controls is zero. Query
# the band, never the labels: only one of the three ever said "control" in its name, so
# a label grep matches one row and passes. This is an acceptance
# criterion on #96, not a footnote.
#
# WHY #3030519 IS NOT HERE
# It is not a § 6 case and it never reached the evaluator — published 31.07 15:40, inside
# the ingestion window, dropped before scoring — so no correct `tool_score` exists for it
# and any value in that column would be invented. It belongs to #107 (drop observability),
# where the drop reason would be observable. Reference for that issue: human **3.5**, band
# `hard_skip`. No posting text is held. Do not add it back as a case here.
#
# PROVENANCE: § 6 of the handoff, which lives on branch `docs-scoring-handoff-verification`
# and is not merged to main at the time of writing. Tool scores are § 6's, transcribed
# verbatim, including where a digest disagrees (see #3025628's note).

# Band cut points, per #96's scope. Read by the harness — defined here and nowhere
# else, so the numbers the issue specifies are visible as data rather than buried in
# a test module. Note the deliberate gaps: 4.5–5.0 and 6.5–7.0 belong to no band.
# `match_score` is an integer (models.py:106), so no tool score can land in one; a
# human score that does is a transcription error and the manifest self-check says so.
bands:
  hard_skip:
    max: 4.5
  marginal:
    min: 5.0
    max: 6.5
  apply:
    min: 7.0

cases:
  # --- § 1 confirmed defects (D1–D6) ------------------------------------------
  # All eight carry a recorded tool score. Six miss their band and are the recorded
  # baseline failures; two miss by less than a band and are marked
  # `pass_with_known_defect` — see `sub_band_defect`.

  - id: "3018325"
    must_not_fire: [penalty_german_language]
    label: ownership-band-and-disjunctive-language
    human_score: 4.0
    human_score_approximate: false
    expected_band: hard_skip
    tool_score: 7
    baseline: fail
    defects: [D2, D5]
    exercises: ownership band (C1) + disjunctive language (B2)
    rules: [C1, B2]
    issues: [101, 98]
    live_rescorable: true
    text_provenance: excerpt
    live_baseline:
      # Re-recorded against the MERGED #97 x #98 prompt — the first input carrying two
      # independent edits to the same rubric. Superseded recordings, both of them
      # measurements of DIFFERENT inputs rather than earlier attempts at this one:
      #   #98/#135  eb00281 / f273254967a1  [6,5,6,6,6,5,6,5,5,6]  penalty_cloud_core 4
      #   #97       e9e9e99 / 4b578b5b4acf  [4,4,4,4,4,4,4,4,4,4]  penalty_german_language 10
      #   pre-both  cbfa1a6 / 330573c8d178  [5,4,4,4,4,3,4,4,4,4]  penalty_mlops_core 1
      #
      # PRE-REGISTERED AND HELD: `penalty_german_language` 0/10, predicted before the run
      # (see the header). It is ABSENT from all ten draws, so #98's disjunction carve-out
      # survives contact with #97's gaps spec. `must_not_fire` below asserts this standing.
      #
      # `penalty_cloud_core` 1/10, against #135's 4/10 with nothing touching the rule —
      # the THIRD unprompted wobble on this row, and the reason this block records
      # frequencies rather than a set. At 1/10 it asserts nothing, which is correct.
      n: 10
      prompt_commit: aff3d28
      input_fingerprint: f871dd69729e
      temperature: 0.0
      recorded: 2026-08-04
      scores: [6, 6, 6, 6, 6, 5, 6, 6, 6, 6]
      fired:
        boost_core_stack: 10
        boost_llm_ownership: 10
        penalty_ramp_up_risk: 10
        penalty_cloud_core: 1
    notes: >-
      Two defects on one posting, both recorded against the tool's output rather than
      the posting. D2: platform-ownership language named in the model's own prose and
      then not penalised — #101 finds the `ownership` deprioritise entry is not merely
      unweighted but contradicted by a +1 `end-to-end ownership` boost, so a fix has to
      move both. D5: the posting's language clause scored as a German requirement, which
      is the disjunction carve-out #98 adds. The clause itself is in the fixture body;
      it is not restated here, because B2 turns on its exact wording.
      INSTABILITY IS CONFINED TO THIS CASE. Measured 2026-08-04 at pinned temperature:
      this row returned several distinct fired-rule sets across 10 draws, while
      #3025628 and #3004625 each returned a SINGLE distinct set across all of theirs.
      Do not read their stability as general — this is the one case both #98 and #101
      turn on, and it is the one that moves. Whether that is bad luck or something
      about this posting is not established; #130 is where it would be settled.

  - id: "3025628"
    label: remote-prose-backstop
    human_score: 3.0
    human_score_approximate: false
    expected_band: hard_skip
    tool_score: 6
    baseline: fail
    defects: [D3, D6]
    exercises: remote prose backstop (B4)
    rules: [B4, C3]
    issues: [99, 103]
    live_rescorable: true
    text_provenance: excerpt
    live_baseline:
      # Re-recorded against the MERGED #97 x #98 prompt, at n=10 where the superseded
      # recordings were n=3. Those are measurements of DIFFERENT inputs, not earlier
      # attempts at this one:
      #   #98/#135  eb00281 / f273254967a1  n=3  [1,1,1]  no boost firing
      #   #97       e9e9e99 / 4b578b5b4acf  n=3  [2,1,1]  boost_visible_contribution 1/3
      #   pre-both  cbfa1a6 / 330573c8d178  n=3  [1,1,1]  no boost firing
      #
      # RESOLVED WHOLE-BLOCK WHEN THE BRANCHES MERGED, AND THE NEXT ONE MUST BE TOO. Only
      # the two provenance lines conflicted: #97's patch moved scores [1,1,1] -> [2,1,1]
      # and added `boost_visible_contribution`, and that hunk applied CLEANLY on top of
      # #135's identical [1,1,1]. Accepting git's per-line resolution would have left #97's
      # numbers under #135's fingerprint — a recording matching no run anyone ever took,
      # and every coherence check here would have passed it. A baseline is ONE measurement
      # of ONE input; merge it as a unit, never line by line. Written up on #138.
      #
      # ⚠️ `penalty_german_language` 2/10 IS A KNOWN OPEN DEFECT — see #139. German named
      # as a PREFERENCE (not a requirement at any level, and not the disjunction #98
      # carved out) still draws a 1-point reduction. It fires at delta -1, never -2, and
      # a second independent n=10 run against this same fingerprint measured 3/10 rather
      # than 2/10 — low-frequency, so a fix cannot be validated at small n.
      #
      # DO NOT add `must_not_fire: [penalty_german_language]` here until #139 lands. The
      # rule genuinely fires today; asserting its absence would turn a known open defect
      # into a red suite on every live run. At 2/10 the count asserts nothing, which is
      # exactly the right amount until the fix exists. #139 also owns adding the
      # pre-registration this row lacked — its absence is why the defect went unseen
      # through #98's validation.
      #
      # ⚠️ THIS IS THE ROW THAT FLAKES, AND IT IS THE ONE TO WATCH. `penalty_ramp_up_risk`
      # and `penalty_remote` are both recorded at 10/10, so both are asserted every-draw by
      # `test_excerpt_fires_the_rules_it_did_before`'s `k == n` rule. Measured in review:
      # 12 consecutive live draws gave 3 FAILURES here, against 12/12 clean on #3004625.
      # So the ~80%-rule-at-the-ceiling problem is real and it bites HERE, not on the row
      # #97's own analysis was about. Recorded as drawn rather than rounded down — see the
      # matching note on #3004625 — but a live run going red on this row is the known
      # threshold problem (#130) rather than a regression, and should be read that way
      # before anyone re-measures the rubric looking for a cause.
      n: 10
      prompt_commit: aff3d28
      input_fingerprint: f871dd69729e
      temperature: 0.0
      recorded: 2026-08-04
      scores: [1, 2, 1, 1, 1, 1, 1, 1, 1, 2]
      fired:
        boost_visible_contribution: 4
        penalty_german_language: 2
        penalty_ramp_up_risk: 10
        penalty_remote: 10
    notes: >-
      D3: the card metadata and the posting body disagree, and only the body carries the
      disqualifying fact — what it says is in the fixture, not here. The metadata filter
      passed the row correctly on a true card field, so the divergence is real at the
      filter and invisible at the evaluator: `build_prompt` (prompt.py:126-129) sends
      title, company, location and description only, so the model has never seen the
      card. That is not a gap in this fixture — it is why § 9 calls the `REDUCE by 3`
      prose rule the sole detector for the class. The rule did not fire; the model
